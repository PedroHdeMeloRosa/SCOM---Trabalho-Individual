<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Aliada - War Thunder</title>
    
    <!-- IMPORTAÇÃO DO CSS UNIFICADO -->
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="icon" href="WT - Artes/WT-ICO2.ico" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
    <!-- IMPORTAÇÃO DO CÉREBRO JAVASCRIPT UNIFICADO -->
    <script src="js/menu.min.js"></script>
    <script>injetarMenu('');</script>

    <main class="ui-container ui-container-relative">
        <div id="loadingOverlay">ESTABELECENDO CONTATO COM A MATRIZ...</div>

        <!-- BARRA SUPERIOR -->
        <div class="top-bar-controls">
            <a href="index.html" class="back-button" style="margin: 0;">&#9664; VOLTAR À CENTRAL</a>
            
            <div style="display: flex; gap: 10px;">
                <button id="btnEditarNacao" class="btn-submit-militar btn-militar-auto btn-militar-gold" style="display: none;">
                    <span class="material-symbols-outlined" style="font-size: 18px;">edit</span> EDITAR NAÇÃO
                </button>
                <button class="btn-toggle-view" id="btnToggleView">&#9776; MODO LISTA</button>
            </div>
        </div>

        <div class="nation-content" id="nacaoContainer" style="display: none;">

            <!-- COLUNA ESQUERDA -->
            <section class="main-panel nation-bg bg-filter nation-info">
                <div class="nation-banner" id="bannerContainer">
                    <img id="dinBandeira" src="" alt="Bandeira da Nação" class="banner-bg-img">
                    <div class="banner-gradient"></div>
                    <h1 class="nation-title-large" id="dinNomeNacao">--</h1>
                </div>

                <div class="presentation-section">
                    <h2 class="section-subtitle">TÁTICAS E ESTILO DE JOGO</h2>
                    <div id="dinLoreNacao" class="lore-text">--</div>
                </div>
            </section>

            <!-- COLUNA DIREITA (CARDS DE TANQUES) -->
            <div class="tank-list-wrapper">
                <button id="btnNovoTanque" class="btn-submit-militar btn-militar-blue" style="display: none; border-style: dashed; margin-bottom: 15px;">
                    <span class="material-symbols-outlined" style="font-size: 18px;">add_circle</span> REQUISITAR NOVO BLINDADO À LINHA DE PRODUÇÃO
                </button>

                <div id="listaTanques" class="tank-list">
                    <!-- Injetados dinamicamente via js/menu.min.js -->
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE EDIÇÃO DA NAÇÃO (HUD TÁTICO FULL SCREEN) -->
    <div class="modal-overlay" id="edicaoNacaoModal">
        <div class="modal-box">
            <button class="fechar-modal" id="closeNacaoModal">X</button>
            <h2 class="modal-title">MODIFICAR DOUTRINA NACIONAL</h2>
            
            <div id="nacaoFeedback" class="tactical-feedback"></div>

            <div class="modal-body-scroll">
                <form id="formEdicaoNacao">
                    <input type="hidden" id="editNacaoId">
                    
                    <div class="input-group">
                        <label>Nome Oficial da Nação</label>
                        <input type="text" id="editNacaoNome" required>
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group input-col">
                            <label>Cor Tema (Ex: #FF0000)</label>
                            <input type="text" id="editNacaoCor">
                        </div>
                        <div class="input-group input-col">
                            <label>Caminho da Bandeira</label>
                            <input type="text" id="editNacaoBandeira" placeholder="WT - Artes/.../Bandeira.jpg">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Táticas e Estilo de Jogo (Suporta tags **negrito** e enter para parágrafos)</label>
                        <textarea id="editNacaoLore" rows="8"></textarea>
                    </div>

                    <div class="editor-footer" style="justify-content: flex-end;">
                        <button type="submit" id="btnSalvarNacao" class="btn-submit-militar btn-militar-auto btn-militar-green">ATUALIZAR REGISTROS NACIONAIS</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
